<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RSS Feed Reader: Mantente al día con las últimas noticias de tus fuentes favoritas." />
    <title>RSS Feed Reader</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/rss-svgrepo-com.svg" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Estilos personalizados (opcional) -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-light">
    <!-- Spinner de carga antes de que React monte la app -->
    <div id="root">
      <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    
    <!-- React App -->
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
